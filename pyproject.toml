[project]
name = "eidolon"
version = "0.1.0"
description = "EIDOLON: An Autonomous Artificial Society, Emergent Intelligence & Computational Sociology Laboratory"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "numpy==2.2.1",
    "scipy==1.15.0",
    "networkx==3.4.2",
    "matplotlib==3.10.0",
    "psutil==6.1.1",
    "websockets==14.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
